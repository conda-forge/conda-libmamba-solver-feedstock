schema_version: 1

context:
  version: "26.4.2"

package:
  name: conda-libmamba-solver
  version: ${{ version }}

source:
  url: https://github.com/conda/conda-libmamba-solver/archive/${{ version }}.tar.gz
  sha256: d69a45db04785a1a48d29d98ee4ce6c19147be4703866a23c6b0da1de12b5378
  target_directory: src/

build:
  number: 1
  noarch: python
  script:
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}
    content: ${{ PYTHON }} -m pip install src/ -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - libmambapy >=2.0.0
    - boltons >=23.0.0
    - msgpack-python >=1.1.1
    - requests >=2.28.0,<3
    - zstandard >=0.15
  run_constraints:
    - conda >=25.9

tests:
  - python:
      imports:
        - conda_libmamba_solver
      pip_check: false
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
        - conda
    script:
      - conda create -c conda-forge -n test --dry-run scipy --solver=libmamba
      - CONDA_SOLVER=libmamba conda create -c conda-forge -n test --dry-run scipy

about:
  license: BSD-3-Clause
  license_file: src/LICENSE
  summary: The fast mamba solver, now in conda!
  homepage: https://github.com/conda/conda-libmamba-solver
  repository: https://github.com/conda/conda-libmamba-solver
  documentation: https://conda.github.io/conda-libmamba-solver/

extra:
  recipe-maintainers:
    - jaimergp
    - jezdez
    - wolfv
